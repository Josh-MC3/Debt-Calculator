<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debt Portfolio Calculator</title>

  <!-- Tailwind (CDN build, fine for a self-contained tool) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM + Babel (for in-browser JSX) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600;700&display=swap');
    .font-serif { font-family: 'Fraunces', Georgia, serif; }
    body, #root { font-family: 'Spline Sans', system-ui, sans-serif; }
    /* hide number input spinners for a cleaner look */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-[#f6f2e9]">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useCallback } = React;

    /* ------------------------------------------------------------------ *
     *  Inline SVG icon helper (replaces lucide-react)
     *  Each icon mirrors the Lucide path set; sized/styled via props.
     * ------------------------------------------------------------------ */
    function Icon({ paths, size = 18, className = "", style }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          style={style}
        >
          {paths}
        </svg>
      );
    }
    const Plus = (p) => <Icon {...p} paths={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />;
    const Trash2 = (p) => <Icon {...p} paths={<><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />;
    const TrendingDown = (p) => <Icon {...p} paths={<><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></>} />;
    const Wallet = (p) => <Icon {...p} paths={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />;
    const Percent = (p) => <Icon {...p} paths={<><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></>} />;
    const CalendarClock = (p) => <Icon {...p} paths={<><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></>} />;
    const AlertTriangle = (p) => <Icon {...p} paths={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />;
    const CheckCircle2 = (p) => <Icon {...p} paths={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />;
    const Coins = (p) => <Icon {...p} paths={<><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></>} />;
    const Landmark = (p) => <Icon {...p} paths={<><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></>} />;

    /* ------------------------------------------------------------------ */
    const FREQUENCIES = {
      Weekly: 52,
      "Bi-weekly": 26,
      Monthly: 12,
      Quarterly: 4,
      Yearly: 1,
    };
    const FREQ_OPTIONS = Object.keys(FREQUENCIES);

    const SLICE_COLORS = [
      "#1f6f5c", "#c2703d", "#3d5a80", "#a8553a", "#6b8f71",
      "#9c6b3f", "#4a4e69", "#8c5e58", "#577590", "#bb8a52",
    ];

    const fmtMoney = (n) =>
      isFinite(n)
        ? n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 })
        : "—";
    const fmtMoneyExact = (n) =>
      isFinite(n)
        ? n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : "—";
    const fmtPct = (n) => (isFinite(n) ? `${n.toFixed(2)}%` : "—");

    const MAX_PERIODS = 100000;

    function makeDebt() {
      return {
        id: (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : Math.random().toString(36).slice(2),
        name: "",
        amount: "",
        apr: "",
        minPayment: "",
        minFreq: "Monthly",
        plannedPayment: "",
        plannedFreq: "Monthly",
        emotionalWeight: 5,
      };
    }

    const STRATEGIES = {
      avalanche: {
        label: "Avalanche",
        sub: "Highest interest first",
        blurb: "Targets the highest APR first. Mathematically cheapest — saves the most money over time.",
      },
      snowball: {
        label: "Snowball",
        sub: "Smallest balance first",
        blurb: "Targets the smallest balance first. Fastest wins build momentum, even if it costs a little more in interest.",
      },
      emotional: {
        label: "Emotional",
        sub: "Heaviest weight first",
        blurb: "Targets the debt with the highest emotional weight first — the one that weighs on you most, regardless of the math.",
      },
    };

    /* ----------------------------- Engine ----------------------------- */
    function computeDebt(debt) {
      const principal = parseFloat(debt.amount);
      const apr = parseFloat(debt.apr);
      const payment = parseFloat(debt.plannedPayment);
      const periodsPerYear = FREQUENCIES[debt.plannedFreq] || 12;

      const valid =
        isFinite(principal) && principal > 0 &&
        isFinite(apr) && apr >= 0 &&
        isFinite(payment) && payment > 0;

      if (!valid) {
        return { valid: false, neverPaysOff: false, months: null, years: null, remainderMonths: null, totalInterest: null, totalPaid: null, periods: null };
      }

      const periodicRate = apr / 100 / periodsPerYear;
      const firstPeriodInterest = principal * periodicRate;

      if (payment <= firstPeriodInterest) {
        return { valid: true, neverPaysOff: true, months: null, years: null, remainderMonths: null, totalInterest: null, totalPaid: null, periods: null, firstPeriodInterest };
      }

      let balance = principal;
      let totalInterest = 0;
      let periods = 0;

      while (balance > 0 && periods < MAX_PERIODS) {
        const interest = balance * periodicRate;
        totalInterest += interest;
        balance += interest;
        balance -= payment;
        periods += 1;
        if (balance < 0) balance = 0;
      }

      if (periods >= MAX_PERIODS && balance > 0) {
        return { valid: true, neverPaysOff: true, months: null, years: null, remainderMonths: null, totalInterest: null, totalPaid: null, periods: null, firstPeriodInterest };
      }

      const totalMonths = (periods / periodsPerYear) * 12;
      const years = Math.floor(totalMonths / 12);
      const remainderMonths = Math.round(totalMonths - years * 12);
      let adjYears = years;
      let adjMonths = remainderMonths;
      if (adjMonths === 12) { adjYears += 1; adjMonths = 0; }

      return {
        valid: true,
        neverPaysOff: false,
        months: totalMonths,
        years: adjYears,
        remainderMonths: adjMonths,
        totalInterest,
        totalPaid: principal + totalInterest,
        periods,
        firstPeriodInterest,
      };
    }

    /* --------------------------- Donut Chart -------------------------- */
    function DonutChart({ data, total }) {
      const size = 220;
      const stroke = 30;
      const radius = (size - stroke) / 2;
      const cx = size / 2;
      const cy = size / 2;
      const circumference = 2 * Math.PI * radius;

      if (!data.length || total <= 0) {
        return (
          <div className="flex flex-col items-center justify-center h-[220px] w-[220px] mx-auto">
            <svg width={size} height={size}>
              <circle cx={cx} cy={cy} r={radius} fill="none" stroke="#e7e0d3" strokeWidth={stroke} />
            </svg>
            <span className="-mt-[140px] text-sm text-stone-400 font-medium tracking-wide">No debt yet</span>
          </div>
        );
      }

      let offsetAccum = 0;
      const segments = data.map((d, i) => {
        const fraction = d.value / total;
        const dash = fraction * circumference;
        const seg = {
          ...d,
          color: SLICE_COLORS[i % SLICE_COLORS.length],
          dashArray: `${dash} ${circumference - dash}`,
          dashOffset: -offsetAccum,
          pct: fraction * 100,
        };
        offsetAccum += dash;
        return seg;
      });

      return (
        <div className="relative mx-auto" style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
            <circle cx={cx} cy={cy} r={radius} fill="none" stroke="#efe9dd" strokeWidth={stroke} />
            {segments.map((s) => (
              <circle
                key={s.id}
                cx={cx} cy={cy} r={radius}
                fill="none"
                stroke={s.color}
                strokeWidth={stroke}
                strokeDasharray={s.dashArray}
                strokeDashoffset={s.dashOffset}
                strokeLinecap="butt"
                style={{ transition: "stroke-dasharray 0.5s ease, stroke-dashoffset 0.5s ease" }}
              />
            ))}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="text-[11px] uppercase tracking-[0.18em] text-stone-400 font-semibold">Total Debt</span>
            <span className="text-2xl font-bold text-stone-800 tabular-nums font-serif">{fmtMoney(total)}</span>
          </div>
        </div>
      );
    }

    /* ----------------------------- Inputs ----------------------------- */
    function Field({ label, children, hint }) {
      return (
        <label className="flex flex-col gap-1">
          <span className="text-[11px] font-semibold uppercase tracking-[0.12em] text-stone-500">{label}</span>
          {children}
          {hint && <span className="text-[11px] text-stone-400">{hint}</span>}
        </label>
      );
    }

    const inputCls =
      "w-full rounded-lg border border-stone-300 bg-white/70 px-3 py-2 text-sm text-stone-800 " +
      "placeholder:text-stone-300 focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/15 " +
      "focus:outline-none transition tabular-nums";

    const selectCls =
      "w-full rounded-lg border border-stone-300 bg-white/70 px-3 py-2 text-sm text-stone-800 " +
      "focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/15 focus:outline-none transition cursor-pointer";

    function MoneyInput({ value, onChange, placeholder }) {
      return (
        <div className="relative">
          <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm">$</span>
          <input
            type="number" inputMode="decimal" min="0" step="any"
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder}
            className={inputCls + " pl-7"}
          />
        </div>
      );
    }

    /* --------------------------- Debt Card ---------------------------- */
    function DebtCard({ debt, index, onChange, onRemove, result, color }) {
      const update = (key) => (val) => onChange(debt.id, { ...debt, [key]: val });
      const displayName = debt.name.trim() || `Unnamed Debt ${index + 1}`;

      return (
        <div className="group relative rounded-2xl border border-stone-200 bg-[#fdfcf8] shadow-sm transition hover:shadow-md">
          <div className="absolute left-0 top-6 bottom-6 w-1 rounded-r-full" style={{ backgroundColor: color }} />
          <div className="p-5 sm:p-6">
            <div className="mb-5 flex items-start justify-between gap-3">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-white" style={{ backgroundColor: color }}>
                  <Landmark size={16} />
                </span>
                <div className="min-w-0">
                  <p className="truncate text-sm font-semibold text-stone-800">{displayName}</p>
                  <p className="text-[11px] text-stone-400">Debt source #{index + 1}</p>
                </div>
              </div>
              <button
                onClick={() => onRemove(debt.id)}
                className="flex items-center gap-1 rounded-lg border border-stone-200 px-2.5 py-1.5 text-xs font-medium text-stone-500 transition hover:border-red-300 hover:bg-red-50 hover:text-red-600"
              >
                <Trash2 size={13} />
                Remove
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="sm:col-span-2">
                <Field label="Debt Name">
                  <input
                    type="text"
                    value={debt.name}
                    onChange={(e) => update("name")(e.target.value)}
                    placeholder="e.g. Car Loan, Credit Card A"
                    className={inputCls}
                  />
                </Field>
              </div>

              <Field label="Initial Amount Remaining">
                <MoneyInput value={debt.amount} onChange={update("amount")} placeholder="0.00" />
              </Field>

              <Field label="Interest Rate (APR)">
                <div className="relative">
                  <input
                    type="number" inputMode="decimal" min="0" step="any"
                    value={debt.apr}
                    onChange={(e) => update("apr")(e.target.value)}
                    placeholder="0.00"
                    className={inputCls + " pr-8"}
                  />
                  <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm">%</span>
                </div>
              </Field>

              <Field label="Minimum Payment">
                <MoneyInput value={debt.minPayment} onChange={update("minPayment")} placeholder="0.00" />
              </Field>

              <Field label="Minimum Payment Frequency">
                <select value={debt.minFreq} onChange={(e) => update("minFreq")(e.target.value)} className={selectCls}>
                  {FREQ_OPTIONS.map((f) => <option key={f} value={f}>{f}</option>)}
                </select>
              </Field>

              <Field label="Planned Payment" hint="What you actually intend to pay">
                <MoneyInput value={debt.plannedPayment} onChange={update("plannedPayment")} placeholder="0.00" />
              </Field>

              <Field label="Planned Payment Frequency">
                <select value={debt.plannedFreq} onChange={(e) => update("plannedFreq")(e.target.value)} className={selectCls}>
                  {FREQ_OPTIONS.map((f) => <option key={f} value={f}>{f}</option>)}
                </select>
              </Field>

              <div className="sm:col-span-2">
                <Field label={"Emotional Weight: " + debt.emotionalWeight + "/10"} hint="How much does this debt weigh on you? (1 = barely, 10 = keeps you up at night)">
                  <div className="flex items-center gap-3 pt-1">
                    <span className="text-xs text-stone-400">1</span>
                    <input
                      type="range" min="1" max="10" step="1"
                      value={debt.emotionalWeight}
                      onChange={(e) => update("emotionalWeight")(parseInt(e.target.value, 10))}
                      className="w-full accent-emerald-700 cursor-pointer"
                    />
                    <span className="text-xs text-stone-400">10</span>
                  </div>
                </Field>
              </div>
            </div>

            {result.valid && result.neverPaysOff && (
              <div className="mt-5 flex items-start gap-2.5 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3">
                <AlertTriangle size={17} className="mt-0.5 shrink-0 text-amber-600" />
                <div>
                  <p className="text-sm font-semibold text-amber-800">Planned payment is too low to cover interest accrual.</p>
                  <p className="text-xs text-amber-700 mt-0.5">
                    At this rate the balance will grow rather than shrink — this debt never reaches $0.
                    The first period accrues {fmtMoneyExact(result.firstPeriodInterest)} in interest.
                  </p>
                </div>
              </div>
            )}

            {result.valid && !result.neverPaysOff && (
              <div className="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="rounded-xl border border-emerald-200 bg-emerald-50/60 px-4 py-3">
                  <div className="flex items-center gap-1.5 text-emerald-700">
                    <CalendarClock size={14} />
                    <span className="text-[11px] font-semibold uppercase tracking-[0.1em]">Time to Freedom</span>
                  </div>
                  <p className="mt-1 text-lg font-bold text-stone-800 tabular-nums">
                    {result.years > 0 && `${result.years} yr `}{result.remainderMonths} mo
                  </p>
                </div>
                <div className="rounded-xl border border-stone-200 bg-white px-4 py-3">
                  <div className="flex items-center gap-1.5 text-stone-500">
                    <Coins size={14} />
                    <span className="text-[11px] font-semibold uppercase tracking-[0.1em]">Total Interest</span>
                  </div>
                  <p className="mt-1 text-lg font-bold text-stone-800 tabular-nums">{fmtMoneyExact(result.totalInterest)}</p>
                </div>
              </div>
            )}

            {!result.valid && (
              <div className="mt-5 flex items-center gap-2 rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-400">
                <CheckCircle2 size={15} />
                Fill in amount, APR, and a planned payment to see your payoff timeline.
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ----------------------------- Metric ----------------------------- */
    function Metric({ icon: IconComp, label, value, accent }) {
      return (
        <div className="rounded-2xl border border-stone-200 bg-[#fdfcf8] p-5 shadow-sm">
          <div className="mb-3 flex h-9 w-9 items-center justify-center rounded-lg" style={{ backgroundColor: accent + "1a", color: accent }}>
            <IconComp size={18} />
          </div>
          <p className="text-[11px] font-semibold uppercase tracking-[0.12em] text-stone-400">{label}</p>
          <p className="mt-1 text-2xl font-bold text-stone-800 tabular-nums font-serif">{value}</p>
        </div>
      );
    }

    /* -------------------------- Payoff Order -------------------------- */
    function PayoffOrder({ ranked, strategy, onStrategyChange }) {
      const meta = STRATEGIES[strategy];
      return (
        <div className="rounded-2xl border border-stone-200 bg-[#fdfcf8] p-6 shadow-sm">
          <div className="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
            <div>
              <h2 className="font-serif text-xl font-bold text-stone-900">Suggested Payoff Order</h2>
              <p className="mt-1 max-w-md text-xs leading-relaxed text-stone-500">{meta.blurb}</p>
            </div>
            <div className="inline-flex shrink-0 rounded-xl border border-stone-200 bg-white p-1">
              {Object.entries(STRATEGIES).map(([key, s]) => {
                const active = key === strategy;
                return (
                  <button
                    key={key}
                    onClick={() => onStrategyChange(key)}
                    className={
                      "rounded-lg px-3 py-1.5 text-xs font-semibold transition " +
                      (active ? "bg-emerald-800 text-white shadow-sm" : "text-stone-500 hover:text-stone-800")
                    }
                    title={s.sub}
                  >
                    {s.label}
                  </button>
                );
              })}
            </div>
          </div>

          {ranked.length === 0 ? (
            <p className="mt-5 text-sm text-stone-400">Add a debt with an amount to see a recommended payoff order.</p>
          ) : (
            <ol className="mt-5 space-y-2">
              {ranked.map((d, i) => (
                <li
                  key={d.id}
                  className="flex items-center gap-3 rounded-xl border border-stone-200 bg-white px-3 py-2.5"
                >
                  <span
                    className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold text-white"
                    style={{ backgroundColor: i === 0 ? "#1f6f5c" : "#a8a29e" }}
                  >
                    {i + 1}
                  </span>
                  <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ backgroundColor: d.color }} />
                  <span className="min-w-0 flex-1 truncate text-sm font-medium text-stone-700">{d.label}</span>
                  <span className="shrink-0 text-xs tabular-nums text-stone-500">{d.metricText}</span>
                </li>
              ))}
            </ol>
          )}
        </div>
      );
    }

    /* ------------------------------ App ------------------------------- */
    function DebtPortfolioCalculator() {
      const [debts, setDebts] = useState([makeDebt()]);
      const [strategy, setStrategy] = useState("avalanche");

      const handleChange = useCallback((id, next) => {
        setDebts((prev) => prev.map((d) => (d.id === id ? next : d)));
      }, []);
      const handleRemove = useCallback((id) => {
        setDebts((prev) => prev.filter((d) => d.id !== id));
      }, []);
      const handleAdd = useCallback(() => {
        setDebts((prev) => [...prev, makeDebt()]);
      }, []);

      const results = useMemo(() => debts.map((d) => computeDebt(d)), [debts]);

      const aggregate = useMemo(() => {
        let totalDebt = 0;
        let totalInterest = 0;
        let weightedRateNumerator = 0;
        let monthlyOutflow = 0;
        let hasInterestComputable = false;
        const chartData = [];

        debts.forEach((d, i) => {
          const amount = parseFloat(d.amount);
          const apr = parseFloat(d.apr);
          const res = results[i];

          if (isFinite(amount) && amount > 0) {
            totalDebt += amount;
            if (isFinite(apr)) weightedRateNumerator += amount * apr;
            chartData.push({ id: d.id, label: d.name.trim() || `Unnamed Debt ${i + 1}`, value: amount });
          }

          if (res.valid && !res.neverPaysOff && isFinite(res.totalInterest)) {
            totalInterest += res.totalInterest;
            hasInterestComputable = true;
          }

          const planned = parseFloat(d.plannedPayment);
          const periodsPerYear = FREQUENCIES[d.plannedFreq] || 12;
          if (isFinite(planned) && planned > 0) {
            monthlyOutflow += (planned * periodsPerYear) / 12;
          }
        });

        const weightedRate = totalDebt > 0 ? weightedRateNumerator / totalDebt : NaN;

        return {
          totalDebt,
          totalInterest: hasInterestComputable ? totalInterest : NaN,
          weightedRate,
          monthlyOutflow,
          chartData,
        };
      }, [debts, results]);

      const ranked = useMemo(() => {
        const items = debts
          .map((d, i) => {
            const amount = parseFloat(d.amount);
            if (!isFinite(amount) || amount <= 0) return null;
            const apr = parseFloat(d.apr);
            return {
              id: d.id,
              label: d.name.trim() || `Unnamed Debt ${i + 1}`,
              color: SLICE_COLORS[i % SLICE_COLORS.length],
              amount,
              apr: isFinite(apr) ? apr : 0,
              weight: d.emotionalWeight || 0,
            };
          })
          .filter(Boolean);

        const sorted = [...items];
        if (strategy === "avalanche") {
          sorted.sort((a, b) => b.apr - a.apr || a.amount - b.amount);
        } else if (strategy === "snowball") {
          sorted.sort((a, b) => a.amount - b.amount || b.apr - a.apr);
        } else {
          sorted.sort((a, b) => b.weight - a.weight || b.apr - a.apr);
        }

        return sorted.map((d) => ({
          ...d,
          metricText:
            strategy === "avalanche"
              ? fmtPct(d.apr)
              : strategy === "snowball"
              ? fmtMoney(d.amount)
              : `Weight ${d.weight}/10`,
        }));
      }, [debts, strategy]);

      return (
        <div className="min-h-screen w-full bg-[#f6f2e9] text-stone-800 antialiased">
          <div className="pointer-events-none fixed inset-0 opacity-[0.5]" style={{
            backgroundImage:
              "radial-gradient(circle at 20% 10%, #fffdf7 0, transparent 45%), radial-gradient(circle at 90% 80%, #eef3ec 0, transparent 50%)",
          }} />

          <div className="relative mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
            <header className="mb-8 flex flex-col gap-1 border-b border-stone-300/70 pb-6">
              <div className="flex items-center gap-2.5">
                <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-800 text-white shadow-sm">
                  <TrendingDown size={20} />
                </span>
                <div>
                  <h1 className="font-serif text-2xl font-bold leading-tight text-stone-900">Debt Portfolio Calculator</h1>
                  <p className="text-sm text-stone-500">Map every balance, model your payoff, and find your date with freedom.</p>
                </div>
              </div>
            </header>

            <section className="mb-8 grid grid-cols-1 gap-5 lg:grid-cols-3">
              <div className="rounded-2xl border border-stone-200 bg-[#fdfcf8] p-6 shadow-sm lg:col-span-1">
                <h2 className="mb-4 text-[11px] font-semibold uppercase tracking-[0.14em] text-stone-400">Debt Breakdown by Source</h2>
                <DonutChart data={aggregate.chartData} total={aggregate.totalDebt} />
                <div className="mt-5 space-y-2">
                  {aggregate.chartData.length === 0 && (
                    <p className="text-center text-xs text-stone-400">Add a debt source to populate the chart.</p>
                  )}
                  {aggregate.chartData.map((d, i) => (
                    <div key={d.id} className="flex items-center justify-between gap-2 text-sm">
                      <div className="flex items-center gap-2 min-w-0">
                        <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ backgroundColor: SLICE_COLORS[i % SLICE_COLORS.length] }} />
                        <span className="truncate text-stone-600">{d.label}</span>
                      </div>
                      <div className="flex shrink-0 items-center gap-2">
                        <span className="font-medium tabular-nums text-stone-700">{fmtMoney(d.value)}</span>
                        <span className="text-xs tabular-nums text-stone-400">
                          {aggregate.totalDebt > 0 ? `${((d.value / aggregate.totalDebt) * 100).toFixed(0)}%` : "—"}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:col-span-2">
                <Metric icon={Wallet} label="Total Debt Remaining" value={fmtMoney(aggregate.totalDebt)} accent="#1f6f5c" />
                <Metric icon={Coins} label="Est. Interest to Be Paid" value={isFinite(aggregate.totalInterest) ? fmtMoney(aggregate.totalInterest) : "—"} accent="#c2703d" />
                <Metric icon={Percent} label="Weighted Avg. Interest Rate" value={fmtPct(aggregate.weightedRate)} accent="#3d5a80" />
                <Metric icon={CalendarClock} label="Monthly Cash Outflow" value={aggregate.monthlyOutflow > 0 ? fmtMoney(aggregate.monthlyOutflow) : "—"} accent="#6b8f71" />
                <div className="sm:col-span-2 rounded-2xl border border-dashed border-stone-300 bg-white/40 p-4 text-xs leading-relaxed text-stone-500">
                  <span className="font-semibold text-stone-600">How it works:</span>{" "}
                  Each debt is amortized using its <em>planned</em> payment. Interest accrues each period at <code>APR ÷ periods-per-year</code> on the balance before the payment is applied. The monthly outflow normalizes every planned payment to a per-month figure, and the weighted average rate is weighted by each balance.
                </div>
              </div>
            </section>

            <section className="mb-8">
              <PayoffOrder ranked={ranked} strategy={strategy} onStrategyChange={setStrategy} />
            </section>

            <div className="mb-4 flex items-center justify-between">
              <h2 className="font-serif text-xl font-bold text-stone-900">
                Your Debt Sources
                <span className="ml-2 align-middle text-sm font-sans font-normal text-stone-400">({debts.length})</span>
              </h2>
              <button
                onClick={handleAdd}
                className="flex items-center gap-1.5 rounded-xl bg-emerald-800 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-900 active:scale-[0.98]"
              >
                <Plus size={16} />
                Add Debt Source
              </button>
            </div>

            {debts.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-stone-300 bg-white/40 py-16 text-center">
                <p className="text-stone-500">No debt sources. You're either debt-free or just getting started.</p>
                <button
                  onClick={handleAdd}
                  className="mt-4 inline-flex items-center gap-1.5 rounded-xl bg-emerald-800 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-900"
                >
                  <Plus size={16} />
                  Add your first debt
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 gap-5 xl:grid-cols-2">
                {debts.map((debt, i) => (
                  <DebtCard
                    key={debt.id}
                    debt={debt}
                    index={i}
                    onChange={handleChange}
                    onRemove={handleRemove}
                    result={results[i]}
                    color={SLICE_COLORS[i % SLICE_COLORS.length]}
                  />
                ))}
              </div>
            )}

            <footer className="mt-10 border-t border-stone-300/70 pt-5 text-center text-xs text-stone-400">
              Estimates are for planning only and assume fixed payments and rates. Not financial advice.
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<DebtPortfolioCalculator />);
  </script>
</body>
</html>
